# ----------------------------------------------------------------------------
# Text of the Notes tab
# ----------------------------------------------------------------------------
notes:
  - "Purpose: the IP2026 line projects (TenneT Investeringsplan 2026, ArcGIS layer IP26_line) written as network edges in the format of full_network.csv, one tab per werkzaamheden type."
  - "One row = one IP26 line feature = one edge (one circuit). Features that TenneT drew twice for the same project (other circuit) are kept as separate edges, like the W/Z circuits in full_network.csv."
  - "Stations: every path end of the IP26 line geometry (RD New) was snapped to the TenneT station layer (TenneT_Assets_Hoogspanning, 371 stations), to the new stations of the IP2026 point layer and to the stations of full_network.csv, and checked against the project name. Station IDs and names are those of full_network.csv where the station exists there, otherwise the ArcGIS STATIONID / OBJECTOMSCHRIJVING, otherwise a new ID (tab Stations, column origin). Name priority: 1) old line file full_network.csv, 2) TenneT ArcGIS map (station layer, OBJECTOMSCHRIJVING), 3) IP2026 point file (new stations) / project name (customer substations) / assumed. Columns from_name_source and to_name_source show which one was used for every row."
  - "Verification of loop-ins, partial sections and medium/low matches: the TenneT conductor layers (TenneT_Assets_Hoogspanning layers 2 and 3, field NETSCHAKELID = circuit ID, same naming as full_network.csv) were queried around each line end; the circuits found are quoted in match_note. The TenneT grid maps (tennet.eu, grid maps June 2026) label only the main 380/220 kV stations and the cross-border stations, so they confirm those names but cannot resolve 150/110 kV or new stations."
  - "Tab Station_match gives, per row, the distance from each assigned station to the nearest end of the line, the confidence and the reasoning. Confidence: high = both stations certain; medium = loop-in into an existing line or project name and geometry differ; low = indicative trace, ambiguous corridor or assumed station: check before use. Partial sections (cable sections etc.) are named in match_note."
  - "Electrical values per circuit: R = r' x length, X = x' x length, B = b' x length (b' in µS/km), with r', x', b' per voltage level and edge type from the Parameters tab (defaults: medians of full_network.csv). Per unit on Sbase = 100 MVA: Zbase = kV^2/Sbase, r_pu = R/Zbase, x_pu = X/Zbase, susceptance_pu_total = B x Zbase, susceptance_pu_half = total/2."
  - "length_m = Shape__Length of the IP26 line (ArcGIS, indicative trace). For partial sections (e.g. cable sections) this is the section length, not the full circuit."
  - "max_current_a: rating per voltage level and edge type (Parameters tab); for lijnverzwaring rows the rating after reinforcement (380/220 kV 4,000 A per IP2026 §7.4; 150/110 kV assumed). sn_mva = sqrt(3) x kV x I / 1000."
  - "edge_type: bovengronds = line, ondergronds = cable (from bovengronds_ondergrond)."
  - "lijnverzwaring tab: the 'Old line values' columns come from full_network.csv: the edge(s) between the same from and to station (direct), or the chain of edges through the via stations. Values are per circuit; 'Matched circuits' gives how many parallel circuits exist. DLR is not in full_network.csv and is left empty."
  - "IP26_point.xlsx (all 366 IP2026 project points) is an input: the coordinates of the new stations are taken from it (column point in extra_stations), tab Station_match shows the point of the same project (n_nummer = nummer) and its distance to the line, and tab IP26_new_stations lists all new-station points and whether an IP26 line connects to them."
  - "n_circuits (N): circuits represented by one edge (parallel equivalent: R/N, X/N, B·N, I·N). Rule per row in column n_circuits_basis: 1) config override, 2) project name ('3e circuit' = 1, '3e en 4e circuit' = 2, 'N circuits'), 3) existing route (lijnverzwaring, Verkabelen, bestaande verbinding): number of circuits of that route in full_network.csv ('Nvt' edges not counted), 4) default 2 per new connection (TenneT builds double-circuit; IP2026 Table 8.3). Projects drawn as several identical features: the first is used, the copies are kept with include_in_network = no. Projects drawn as k different features between the same stations: N divided over them."
  - "Filter include_in_network = yes before building a network model, otherwise duplicate features are counted twice."
  - "Last four columns (from the original template IP26_line_separate_sheet): X model = L·x′·√3/N, X standard = L·x′/N, Peak capacity = N·cap, Secure capacity = MVA·PF·RF, with L = Shape__Length/1000, x′ = the x′ of the row's voltage and edge type (Parameters, 'Electrical parameters per circuit'; so X standard = reactance_ohm and X model = √3 × reactance_ohm), cap = 1000 MVA per 380 kV circuit, PF = 0.95, RF = 1 (Parameters tab, template block). For 220/150/110 kV the template has no capacity value, so Peak capacity = sn_mva of the row."
  - "Rows 458-461 have no project data and no geometry in the input; they are kept without stations or values."
