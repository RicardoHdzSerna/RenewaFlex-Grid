# ============================================================================
# Configuration for ip26_network_build.py
# Converts the TenneT IP2026 line projects (IP26_line.xlsx) into network edges
# in the same format as full_network.csv (edge list with from/to station,
# R, X, B in ohm and per unit, rating and MVA), one tab per werkzaamheden type.
# Edit values here; do not edit the Python code.
# ============================================================================

paths:
  input_folder: DATA          # data folder inside NewLines_IP26 (relative to this config file, or absolute)
  output_folder: output
  input_file: IP26_line.xlsx                       # TenneT IP2026 line export
  network_file: full_network.csv                   # existing ("old") network, edge list
  stations_file: stations_tennet_arcgis.csv        # TenneT station list (ArcGIS layer TenneT_Assets_Hoogspanning/5), RD New coordinates
  endpoints_file: ip26_line_endpoints.csv          # first/last vertex of every path of every IP26 line (ArcGIS layer IP26_line), RD New
  points_file: IP26_point.xlsx                     # IP2026 point export (all 366 project points, x_coord/y_coord in RD New)
  output_file: IP26_line_network_edges.xlsx

# "formulas": electrical columns are Excel formulas referencing the Parameters tab (live workbook).
# "values":   the numbers computed in Python are written instead.
output_mode: formulas

# ----------------------------------------------------------------------------
# Per-unit system
# ----------------------------------------------------------------------------
system:
  s_base_mva: 100        # Sbase used in full_network.csv (r_pu = R / (kV^2 / Sbase))
  # bovengronds_ondergrond -> edge_type
  edge_type_map:
    bovengronds: line
    ondergronds: cable
  default_edge_type: line      # used when bovengronds_ondergrond is empty

# ----------------------------------------------------------------------------
# Electrical parameters per voltage level and edge type (one circuit).
# Defaults = medians of all lines/cables of that voltage and type in
# full_network.csv (r' = R/length, x' = X/length, b' = B_total/length).
# max_current_a for NEW connections. For lijnverzwaring rows see
# 'reinforced_max_current_a' below.
# ----------------------------------------------------------------------------
line_types:
  - {kv: 380, edge_type: line,  r_ohm_per_km: 0.0300, x_ohm_per_km: 0.2800, b_uS_per_km: 4.084,  max_current_a: 4000, source: "r', x', b': median of 101 380 kV lines in full_network.csv. Rating: TenneT IP2026 Net op land §7.4 (new/upgraded domestic 380 kV connections 4,000 A)."}
  - {kv: 380, edge_type: cable, r_ohm_per_km: 0.0199, x_ohm_per_km: 0.1335, b_uS_per_km: 65.345, max_current_a: 1481, source: "Median of 8 380 kV cables in full_network.csv."}
  - {kv: 220, edge_type: line,  r_ohm_per_km: 0.0320, x_ohm_per_km: 0.2961, b_uS_per_km: 3.770,  max_current_a: 4000, source: "r', x', b': median of 36 220 kV lines in full_network.csv. Rating: TenneT IP2026 §7.4 (220 kV connections upgraded to 4,000 A)."}
  - {kv: 220, edge_type: cable, r_ohm_per_km: 0.0601, x_ohm_per_km: 0.2179, b_uS_per_km: 65.973, max_current_a: 600,  source: "Median of 6 220 kV cables in full_network.csv (small sample)."}
  - {kv: 150, edge_type: line,  r_ohm_per_km: 0.0600, x_ohm_per_km: 0.3300, b_uS_per_km: 3.456,  max_current_a: 900,  source: "Median of 295 150 kV lines in full_network.csv."}
  - {kv: 150, edge_type: cable, r_ohm_per_km: 0.0800, x_ohm_per_km: 0.1100, b_uS_per_km: 69.115, max_current_a: 800,  source: "Median of 129 150 kV cables in full_network.csv."}
  - {kv: 110, edge_type: line,  r_ohm_per_km: 0.0800, x_ohm_per_km: 0.3500, b_uS_per_km: 3.142,  max_current_a: 700,  source: "Median of 138 110 kV lines in full_network.csv."}
  - {kv: 110, edge_type: cable, r_ohm_per_km: 0.1000, x_ohm_per_km: 0.1200, b_uS_per_km: 78.540, max_current_a: 600,  source: "Median of 54 110 kV cables in full_network.csv."}

# Rating used for rows of type lijnverzwaring (line reinforcement), per kV.
# Same values as the Parameters tab of IP26_line_separate_sheet.xlsx (rows 13, 15, 16).
# Set to null to use the line_types rating instead.
reinforced_max_current_a:
  380: {value: 4000, source: "TenneT IP2026 Net op land §7.4: all domestic 380 kV and 220 kV connections upgraded to 4,000 A."}
  220: {value: 4000, source: "TenneT IP2026 Net op land §7.4."}
  150: {value: 1500, source: "Assumption (not published by TenneT), same placeholder as IP26_line_separate_sheet Parameters!C15."}
  110: {value: 1000, source: "Assumption (not published by TenneT), same placeholder as IP26_line_separate_sheet Parameters!C16."}

# ----------------------------------------------------------------------------
# Number of circuits per edge (n_circuits). One edge = the parallel equivalent of
# n circuits (pandapower 'parallel'): R/n, X/n, B*n, I*n.
# Rules, in this order (column n_circuits_basis shows which one was used):
#   1. override per OBJECTID
#   2. project name ('3e circuit' = 1 new circuit, '3e en 4e circuit' = 2, 'N circuits' = N)
#   3. existing route (types below, or bestaand_nieuw = bestaande verbinding):
#      number of circuits of that route in full_network.csv (circuit letters W, Z, G, ...)
#   4. default per kV
# Then, per project and station pair: features with identical geometry are duplicates
# (kept, include_in_network = no); if one project is drawn as k different features
# between the same stations, its circuits are divided over them (N / k).
# ----------------------------------------------------------------------------
circuits:
  override:
    297: 2   # cable sections on DB-VNG150 W/Z and on DOD-VNG150 W / VNW-VNG150 Z: 2 circuits (the via-chain rule alone finds 1)
  ignore_circuit_ids: [Nvt]   # 'Nvt' (niet van toepassing) edges in full_network.csv are not counted as circuits
  name_rules:
    - {pattern: "3e en 4e circuit", circuits: 2}
    - {pattern: "3e circuit", circuits: 1}
    - {pattern: "(\\d+) circuits", circuits: group}
  existing_route_types: [lijnverzwaring, Verkabelen]
  default_by_kv: {380: 2, 220: 2, 150: 2, 110: 2}
  default_source: "Assumption: new TenneT connections are built double-circuit (IP2026 Table 8.3: Rilland-Tilburg 2 circuits of 2,635 MVA; same assumption as Parameters!C19 in IP26_line_separate_sheet)."
default_circuits: 1      # fallback only

# ----------------------------------------------------------------------------
# Parameters of the original template IP26_line_separate_sheet, used for the last
# four columns of every data tab:
#   X model (Ω) = L·x′·√3/N, X standard (Ω) = L·x′/N (x′ from line_types, per kV and edge type,
#   so X standard = reactance_ohm), Peak capacity (MVA) = N·cap,
#   Secure capacity (MW) = MVA·PF·RF, with L = Shape__Length/1000 and N = n_circuits.
# ----------------------------------------------------------------------------
template_parameters:
  capacity_per_circuit_mva: {label: "Thermal capacity per circuit (cap)", value: 1000, unit: "MVA", source: "Value of the original template (Parameters!C6), defined for 380 kV circuits."}
  power_factor:             {label: "Power factor (PF)", value: 0.95, unit: "–", source: "Original template assumption (Parameters!C7)."}
  reserve_factor:           {label: "Reserve factor (RF)", value: 1, unit: "–", source: "Original template assumption (Parameters!C8)."}
  capacity_applies_to_kv: [380]   # other voltages: Peak capacity = sn_mva of the row

# Point types of IP26_point.xlsx listed in the tab IP26_new_stations
new_station_types: [nieuw hoogspanningsstation]

# ----------------------------------------------------------------------------
# Station matching
# ----------------------------------------------------------------------------
matching:
  # An assigned station counts as "on the geometry" when it lies within this
  # distance of an end of a path of the IP26 line.
  geometry_tolerance_m: 1000
  # Rows without an entry in 'assignments' get stations automatically: the line
  # ends (path ends used once) are snapped to the nearest station of the same kV
  # within this distance; otherwise the end is left empty.
  auto_snap_max_m: 1500
  edge_id_prefix: "branch:"
  edge_id_suffix: "IP26-{oid}"     # edge_id = branch:<FROM>-<TO><kV> IP26-<OBJECTID>

