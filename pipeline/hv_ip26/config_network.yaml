# ----------------------------------------------------------------------------
# Station assignment per IP26 line (OBJECTID).
#   from / to : station IDs (full_network.csv / ArcGIS STATIONID / extra_stations)
#   via       : intermediate stations named in the project or on the route
#   conf      : high   = both stations certain: line ends at the stations and/or confirmed by the
#                        TenneT conductor IDs (asset layer NETSCHAKELID) at the line ends
#               medium = loop-in into an existing line (far station is one of the two ends of
#                        that line) or project name and geometry disagree
#               low    = indicative trace, ambiguous corridor or assumed station: check
#   old_chain_first: true = use old_chain before the direct from-to edge for the old line values
#   old_chain : stations used to look up the old line in full_network.csv when the
#               direct from-to edge does not exist (lijnverzwaring tab)
#   note      : shown in the output (match_note)
